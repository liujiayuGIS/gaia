name: GAIA desktop
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Build platforms'
        type: choice
        options: [all, windows, macos]
        default: all
  push:
    branches: [codex/desktop-v05, codex/desktop-beta2]
    paths: ['desktop/**', 'backend/**', 'frontend/**', 'skills/**', 'scripts/package_desktop_runtime.py', '.github/workflows/desktop.yml', 'docs/DESKTOP.md', 'docs/USER_GUIDE.md', 'docs/releases/**', 'docs/THIRD_PARTY_NOTICES.md']
env:
  PYTHONUTF8: '1'
permissions:
  contents: write
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      matrix: ${{ steps.tag.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ inputs.target || 'all' }}
        run: |
          VERSION=$(node -p "require('./desktop/package.json').version")
          TAG="desktop-v$VERSION-${GITHUB_SHA:0:7}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          node -e 'const rows=[{runner:"macos-15",arch:"arm64",flag:"--mac --arm64"},{runner:"macos-15-intel",arch:"x64",flag:"--mac --x64"},{runner:"windows-2022",arch:"x64",flag:"--win --x64"}];const target=process.env.TARGET;console.log("matrix="+JSON.stringify({include:rows.filter(r=>target==="all"||(target==="windows"?r.runner.startsWith("windows"):r.runner.startsWith("macos")))}))' >> "$GITHUB_OUTPUT"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft --prerelease --target "$GITHUB_SHA" --title "GAIA $VERSION · 桌面预览版" --notes-file docs/releases/0.5.0-beta.2.md
  build:
    needs: release
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            frontend/package-lock.json
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: desktop/environment.yml
          cache-environment: true
          cache-downloads: true
      - name: Build frontend and desktop
        run: |
          npm --prefix frontend ci --ignore-scripts
          npm --prefix frontend run build
          npm --prefix desktop ci
          npm --prefix desktop test
      - name: Install application Python dependencies
        run: micromamba run -n gaia-desktop python -m pip install -r desktop/requirements-app.txt
      - name: Native GIS and sandbox tests
        env:
          PYTHONPATH: backend
          GAIA_DESKTOP_NATIVE_TESTS: '1'
          GEOAGENT_NATIVE_TESTS: '1'
          GEOAGENT_WORKSPACE: .desktop-build/test-workspace
          GEOAGENT_CACHE_DIR: .desktop-build/test-cache
        run: |
          export GIS_QGIS_PYTHON="$MAMBA_ROOT_PREFIX/envs/gaia-desktop/bin/python"
          if [ "$RUNNER_OS" = Windows ]; then export GIS_QGIS_PYTHON="$MAMBA_ROOT_PREFIX/envs/gaia-desktop/python.exe"; fi
          export GIS_PYTHON="$GIS_QGIS_PYTHON"
          micromamba run -n gaia-desktop python -m pytest backend/tests/test_desktop.py backend/tests/test_layout_styles.py desktop/tests/test_pack_runtime.py -q --basetemp .desktop-build/native-tests
      - name: Bundle Python and QGIS
        run: micromamba run -n gaia-desktop python scripts/package_desktop_runtime.py --prefix "$MAMBA_ROOT_PREFIX/envs/gaia-desktop" --skip-create
      - name: First launch, private API, and restart persistence
        run: npm --prefix desktop run smoke
      - name: Create installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm --prefix desktop run dist -- ${{ matrix.flag }}
      - name: Packaged application launch and persistence
        run: |
          export GAIA_SMOKE_DATA_DIR="$(cat .desktop-build/qa/smoke-user-data.txt)"
          export GAIA_PACKAGED_EXECUTABLE="$PWD/.desktop-build/installers/mac/GAIA.app/Contents/MacOS/GAIA"
          if [ "${{ matrix.arch }}" = arm64 ]; then export GAIA_PACKAGED_EXECUTABLE="$PWD/.desktop-build/installers/mac-arm64/GAIA.app/Contents/MacOS/GAIA"; fi
          if [ "$RUNNER_OS" = Windows ]; then export GAIA_PACKAGED_EXECUTABLE="$PWD/.desktop-build/installers/win-unpacked/GAIA.exe"; fi
          npm --prefix desktop run smoke
      - name: Verify macOS bundle signature after use
        if: runner.os == 'macOS'
        run: |
          APP=.desktop-build/installers/mac/GAIA.app
          if [ "${{ matrix.arch }}" = arm64 ]; then APP=.desktop-build/installers/mac-arm64/GAIA.app; fi
          codesign --verify --deep --strict "$APP"
          node desktop/tests/branding-mac.cjs "$APP" "${{ matrix.arch }}"
      - name: Install Windows package and launch installed app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem .desktop-build/installers/GAIA-*-win-x64.exe | Select-Object -First 1
          $installRoot = Join-Path $env:RUNNER_TEMP 'GAIA Installer Test'
          $installed = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', "/D=$installRoot") -Wait -PassThru
          if ($installed.ExitCode -ne 0) { throw "Installer failed: $($installed.ExitCode)" }
          $env:GAIA_PACKAGED_EXECUTABLE = Join-Path $installRoot 'GAIA.exe'
          $env:GAIA_SMOKE_DATA_DIR = Get-Content .desktop-build/qa/smoke-user-data.txt
          npm --prefix desktop run smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./desktop/tests/branding.ps1 -Executable $env:GAIA_PACKAGED_EXECUTABLE -Installer $installer.FullName -ExpectedIcon .desktop-build/icons/icon.ico -Output .desktop-build/qa
      - name: Checksums
        run: node -e "const fs=require('fs'),c=require('crypto'),p='.desktop-build/installers/';(async()=>{for(const f of fs.readdirSync(p).filter(x=>/\.(dmg|exe)$/.test(x))){const h=c.createHash('sha256');for await(const b of fs.createReadStream(p+f))h.update(b);fs.writeFileSync(p+f+'.sha256',h.digest('hex')+'  '+f+'\n')}})().catch(e=>{console.error(e);process.exit(1)})"
      - name: Upload tested installers to draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          for FILE in .desktop-build/installers/*.dmg .desktop-build/installers/*.exe .desktop-build/installers/*.sha256; do
            [ -f "$FILE" ] && gh release upload "$TAG" "$FILE" --clobber
          done
      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-diagnostics-${{ matrix.runner }}
          path: |
            .desktop-build/qa
            .desktop-build/test-workspace/jobs/*/stderr.log
            .desktop-build/native-tests/**/stderr.log
            .desktop-build/native-tests/**/stdout.log
          retention-days: 7
  publish:
    needs: [release, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release.outputs.tag }}
        run: gh release edit "$TAG" --draft=false --prerelease --notes-file docs/releases/0.5.0-beta.2.md
